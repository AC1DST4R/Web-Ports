<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Port Not Found</title>
<meta name="theme-color" content="#0b0b0e">

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #09090b;
    --panel: rgba(18, 18, 22, 0.72);
    --border: rgba(255, 255, 255, 0.08);
    --text: #f5f5f5;
    --muted: #85858f;
    --dim: #50505a;
    --red: #ff3b3b;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at 50% 35%, rgba(255, 255, 255, 0.055), transparent 28%),
        radial-gradient(circle at 20% 80%, rgba(255, 50, 50, 0.035), transparent 25%),
        var(--bg);
    color: var(--text);
    font-family: "Inter", sans-serif;
    overflow: hidden;
}

/* Background grid */

.grid {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.25;
    background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 45px 45px;
    mask-image: linear-gradient(to bottom, transparent, black 20%, black 80%, transparent);
}

/* Scanlines */

.scanlines {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 20;
    opacity: 0.035;
    background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        #fff 4px
    );
}

/* Floating particles */

.particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

.particle {
    position: absolute;
    width: 2px;
    height: 2px;
    background: #fff;
    border-radius: 50%;
    opacity: 0.2;
    animation: float 8s infinite ease-in-out;
}

.particle:nth-child(1) { left: 12%; top: 20%; animation-delay: 0s; }
.particle:nth-child(2) { left: 25%; top: 75%; animation-delay: 2s; }
.particle:nth-child(3) { left: 72%; top: 18%; animation-delay: 4s; }
.particle:nth-child(4) { left: 88%; top: 68%; animation-delay: 1s; }
.particle:nth-child(5) { left: 53%; top: 88%; animation-delay: 3s; }
.particle:nth-child(6) { left: 8%; top: 52%; animation-delay: 5s; }

@keyframes float {
    0%, 100% {
        transform: translateY(0);
        opacity: 0.15;
    }
    50% {
        transform: translateY(-20px);
        opacity: 0.45;
    }
}

/* Main */

.wrapper {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
    position: relative;
    z-index: 5;
}

.card {
    width: min(700px, 100%);
    padding: 48px;
    text-align: center;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 24px;
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    box-shadow:
        0 30px 100px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.035);
    animation: cardIn 0.7s cubic-bezier(.16,1,.3,1);
}

@keyframes cardIn {
    from {
        opacity: 0;
        transform: translateY(20px) scale(0.97);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* Header */

.brand {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 9px;
    margin-bottom: 38px;
    color: #aaaab2;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.brand-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 12px rgba(255, 59, 59, 0.8);
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0%, 100% {
        opacity: 1;
        transform: scale(1);
    }
    50% {
        opacity: 0.45;
        transform: scale(0.75);
    }
}

/* 404 */

.error {
    position: relative;
    display: inline-block;
    font-size: clamp(110px, 22vw, 190px);
    line-height: 0.8;
    font-weight: 900;
    letter-spacing: -13px;
    color: #fff;
    user-select: none;
    animation: errorFloat 4s ease-in-out infinite;
}

@keyframes errorFloat {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-5px);
    }
}

.error::before,
.error::after {
    content: "404";
    position: absolute;
    inset: 0;
    opacity: 0;
    pointer-events: none;
}

.error::before {
    color: #ff3b3b;
    animation: glitchOne 4s infinite;
}

.error::after {
    color: #777;
    animation: glitchTwo 4s infinite;
}

@keyframes glitchOne {
    0%, 89%, 94%, 100% {
        opacity: 0;
        transform: translate(0);
    }
    90% {
        opacity: 0.8;
        transform: translate(-4px, 2px);
        clip-path: inset(30% 0 50% 0);
    }
    92% {
        opacity: 0;
    }
}

@keyframes glitchTwo {
    0%, 91%, 95%, 100% {
        opacity: 0;
        transform: translate(0);
    }
    92% {
        opacity: 0.5;
        transform: translate(4px, -2px);
        clip-path: inset(60% 0 15% 0);
    }
}

/* Content */

.title {
    margin-top: 38px;
    font-size: 27px;
    font-weight: 800;
    letter-spacing: -0.7px;
}

.description {
    max-width: 490px;
    margin: 13px auto 0;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.75;
}

/* Path */

.path-box {
    margin: 28px auto 0;
    padding: 14px 17px;
    max-width: 570px;
    text-align: left;
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 12px;
    background: rgba(0,0,0,0.25);
    font-family: "JetBrains Mono", monospace;
    overflow: hidden;
}

.path-label {
    margin-bottom: 7px;
    color: var(--dim);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
}

.path {
    color: #a5a5ae;
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.path span {
    color: var(--red);
}

/* Status */

.status {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-top: 25px;
    color: #606069;
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
}

.status-item {
    display: flex;
    align-items: center;
    gap: 6px;
}

.status-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--red);
}

/* Buttons */

.buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 30px;
}

.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 155px;
    padding: 12px 20px;
    border-radius: 11px;
    border: 1px solid rgba(255,255,255,0.09);
    background: rgba(255,255,255,0.035);
    color: #eee;
    font-size: 13px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
    transition:
        transform 0.2s ease,
        background 0.2s ease,
        border-color 0.2s ease;
}

.btn:hover {
    transform: translateY(-2px);
    background: rgba(255,255,255,0.07);
    border-color: rgba(255,255,255,0.15);
}

.btn.primary {
    background: #fff;
    color: #0b0b0e;
    border-color: #fff;
}

.btn.primary:hover {
    background: #e8e8e8;
}

/* Footer */

.footer {
    margin-top: 35px;
    color: #414149;
    font-family: "JetBrains Mono", monospace;
    font-size: 9px;
    letter-spacing: 1px;
}

/* Mobile */

@media (max-width: 600px) {

    .card {
        padding: 35px 22px;
        border-radius: 20px;
    }

    .brand {
        margin-bottom: 30px;
    }

    .error {
        font-size: 105px;
        letter-spacing: -8px;
    }

    .title {
        font-size: 23px;
    }

    .description {
        font-size: 13px;
    }

    .status {
        flex-direction: column;
        gap: 8px;
        align-items: center;
    }

    .buttons {
        flex-direction: column;
    }

    .btn {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="grid"></div>

<div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
</div>

<div class="scanlines"></div>

<main class="wrapper">

    <section class="card">

        <div class="brand">
            <div class="brand-dot"></div>
            WEB-PORTS SYSTEM
        </div>

        <div class="error">404</div>

        <h1 class="title">
            Port Not Found
        </h1>

        <p class="description">
            The port you're trying to access doesn't exist.
            It may have been moved, removed, or the address may have been entered incorrectly.
        </p>

        <div class="path-box">
            <div class="path-label">
                Requested Resource
            </div>

            <div class="path" id="requestedPath">
                /
            </div>
        </div>

        <div class="status">

            <div class="status-item">
                <div class="status-dot"></div>
                RESOURCE OFFLINE
            </div>

            <div class="status-item">
                <div class="status-dot"></div>
                ERROR 404
            </div>

        </div>

        <div class="buttons">

            <a class="btn primary" href="/Web-Ports/">
                ← Return to Launcher
            </a>

            <button class="btn" onclick="history.back()">
                Go Back
            </button>

        </div>

        <div class="footer">
            WEB-PORTS // CONNECTION TERMINATED
        </div>

    </section>

</main>

<script>
const path = window.location.pathname;

document.getElementById("requestedPath").innerHTML =
    path.replace(
        /([\/][^\/]*)$/,
        '<span>$1</span>'
    );
</script>

</body>
</html>
